name: Fixtures

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    name: Validate fixtures against schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate fixtures
        run: npm run validate:fixtures
